<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          root.dataset.theme = localStorage.getItem('pharmacare.theme') || 'light';
          root.dataset.animations = localStorage.getItem('pharmacare.animations') === 'false' ? 'off' : 'on';
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.animations = 'on';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>PharmaCare - Pharmacy Management System</title>
    <meta name="description" content="Enterprise pharmacy management system with POS, FEFO batch tracking, drug scheduling compliance, khata ledgers, and financial accounting." />
    <meta property="og:title" content="PharmaCare - Pharmacy Management System" />
    <meta property="og:description" content="Enterprise pharmacy management system with POS, FEFO batch tracking, drug scheduling compliance, khata ledgers, and financial accounting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
