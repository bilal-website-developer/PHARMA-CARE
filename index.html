<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const preference = (name) => {
            const currentKey = `pharma-care.${name}`;
            const legacyKey = `pharmacare.${name}`;
            let value = localStorage.getItem(currentKey);
            if (value === null) {
              value = localStorage.getItem(legacyKey);
              if (value !== null) localStorage.setItem(currentKey, value);
            }
            return value;
          };
          root.dataset.theme = preference('theme') || 'light';
          root.dataset.animations = preference('animations') === 'false' ? 'off' : 'on';
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.animations = 'on';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/pharma-care-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pharma-care-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pharma-care-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#147d43" />
    <title>Pharma Care</title>
    <meta name="description" content="Enterprise pharmacy management system with POS, FEFO batch tracking, drug scheduling compliance, khata ledgers, and financial accounting." />
    <meta property="og:title" content="Pharma Care" />
    <meta property="og:description" content="Enterprise pharmacy management system with POS, FEFO batch tracking, drug scheduling compliance, khata ledgers, and financial accounting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
